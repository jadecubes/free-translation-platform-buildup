stages:
  - test
  - translate

variables:
  # Target languages (comma-separated, overridable via Run pipeline form)
  TARGET_LANGUAGES: "fr,ja,zh-Hant-HK"

# --- Unit tests: runs on every push ---
test:
  stage: test
  image: node:20-alpine
  script:
    - cd tools/translate
    - npm ci
    - npm test

# --- Translation: manual job, run from the pipeline view or Run pipeline form ---
translate:
  stage: translate
  image: node:20-alpine
  before_script:
    # Install git for committing results
    - apk add --no-cache git curl
    # Configure git for commits
    - git config --global user.email "translator@ci.local"
    - git config --global user.name "Translation Bot"
  script:
    # Fail fast on missing push credentials — before spending Gemini API calls
    - |
      if [ -z "$PROJECT_TOKEN" ]; then
        echo "Missing PROJECT_TOKEN CI variable (project access token with write_repository scope) — required to push the translation branch"
        exit 1
      fi
    - cd tools/translate
    - npm ci
    # Set PROJECT_ROOT so translate tool finds locales/ directory
    - export PROJECT_ROOT=$CI_PROJECT_DIR
    - npm run translate
    # Check if there are changes to commit
    - cd ../..
    # Stage first: git diff alone misses untracked files (first run creates new locale files)
    - git add locales/
    - |
      if git diff --cached --quiet; then
        echo "No translation changes detected"
      else
        BRANCH_NAME="translate/$(date +%Y%m%d-%H%M%S)"
        echo "Creating branch $BRANCH_NAME..."
        git checkout -b "$BRANCH_NAME"
        git commit -m "chore: update translations"
        # http.sslVerify=false: local GitLab uses a self-signed certificate
        git -c http.sslVerify=false push \
          "${CI_SERVER_PROTOCOL}://oauth2:${PROJECT_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.git" \
          "$BRANCH_NAME"
        echo "Creating Merge Request..."
        curl --fail --insecure --request POST \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" \
          --form "source_branch=$BRANCH_NAME" \
          --form "target_branch=$CI_COMMIT_REF_NAME" \
          --form "title=chore: update translations" \
          --form "remove_source_branch=true"
      fi
  rules:
    - when: manual
      allow_failure: true
