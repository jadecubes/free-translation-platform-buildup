name: Tests

on:
  push:
    paths:
      - "tools/translate/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/translate/**"
      - ".github/workflows/test.yml"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: tools/translate
      - name: Run unit tests
        run: npx vitest run --reporter=verbose
        working-directory: tools/translate
