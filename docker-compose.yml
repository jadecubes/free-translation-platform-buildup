version: '3'

services:
  # GitLab instance
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: gitlab.local
    restart: unless-stopped
    ports:
      - "8081:443"   # GitLab HTTPS
      - "2222:22"    # SSH
      - "8083:80"    # GitLab HTTP
      - "8084:8084"  # GitLab Pages
    volumes:
      - ./gitlab-data/config:/etc/gitlab
      - ./gitlab-data/logs:/var/log/gitlab
      - ./gitlab-data/data:/var/opt/gitlab
      - ./ssl/gitlab.local.crt:/etc/gitlab/ssl/gitlab.local.crt:ro
      - ./ssl/gitlab.local.key:/etc/gitlab/ssl/gitlab.local.key:ro
    networks:
      - translation-network
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.local:8081'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD}'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222

        # Enable HTTPS with self-signed certificate
        nginx['listen_port'] = 443
        nginx['listen_https'] = true
        nginx['ssl_certificate'] = '/etc/gitlab/ssl/gitlab.local.crt'
        nginx['ssl_certificate_key'] = '/etc/gitlab/ssl/gitlab.local.key'
        nginx['redirect_http_to_https'] = true

        # Keep HTTP for internal use
        nginx['custom_gitlab_server_config'] = "listen 80;"

        # macOS Docker compatibility
        gitlab_workhorse['listen_network'] = "tcp"
        gitlab_workhorse['listen_addr'] = "127.0.0.1:8181"

        # GitLab Pages
        pages_external_url 'http://gitlab.local:8084'
        gitlab_pages['enable'] = true

        # Performance optimization - reduce memory usage
        puma['worker_processes'] = 1
        puma['worker_timeout'] = 60
        sidekiq['max_concurrency'] = 5
        postgresql['shared_buffers'] = "128MB"
        postgresql['max_connections'] = 100
        prometheus_monitoring['enable'] = false
        gitaly['ruby_max_rss'] = 200000000
        gitaly['concurrency'] = [{ 'rpc' => '/gitaly.SmartHTTPService/PostReceivePack', 'max_per_repo' => 3 }, { 'rpc' => '/gitaly.SSHService/SSHUploadPack', 'max_per_repo' => 3 }]
    shm_size: '512m'
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1.5G

  # GitLab Runner for CI/CD
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - ./gitlab-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - translation-network
    depends_on:
      - gitlab
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  translation-network:
    driver: bridge
