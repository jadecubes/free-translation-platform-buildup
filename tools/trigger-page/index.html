<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translation Trigger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 24px; }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .panel h2 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Source keys table */
    .source-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .source-table th {
      text-align: left;
      padding: 8px 10px;
      background: #f9f9f9;
      border-bottom: 2px solid #ddd;
      font-weight: 600;
    }
    .source-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }
    .source-table td:first-child {
      font-family: "SF Mono", Monaco, Consolas, monospace;
      color: #0066cc;
      white-space: nowrap;
      width: 180px;
    }
    .source-table td:nth-child(3) {
      color: #888;
      font-size: 0.8rem;
    }
    .source-table-wrap { max-height: 320px; overflow-y: auto; }

    /* Controls */
    .controls { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 0.8rem; font-weight: 600; color: #555; }
    .field input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 300px;
    }

    .btn {
      padding: 10px 28px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #0066cc;
      color: #fff;
    }
    .btn-primary:hover { background: #0055aa; }
    .btn-primary:disabled {
      background: #999;
      cursor: not-allowed;
    }

    /* Status */
    .status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
    .status.info { display: block; background: #e8f4fd; color: #0066cc; }
    .status.success { display: block; background: #e6f9e6; color: #1a7a1a; }
    .status.error { display: block; background: #fde8e8; color: #cc0000; }
    .status a { color: inherit; font-weight: 600; }

    /* Settings */
    .settings-toggle {
      cursor: pointer;
      user-select: none;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .settings-grid .field input { width: 100%; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .key-count {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 8px;
    }

    /* Pipeline info */
    .pipeline-info {
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.8;
    }
    .pipeline-info a.btn {
      display: inline-block;
      text-decoration: none;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>Translation Trigger</h1>
  <p class="subtitle">View source keys and trigger the GitLab CI translation pipeline</p>

  <!-- Settings -->
  <div class="panel">
    <h2 class="settings-toggle" id="settingsToggle">Settings &#9654;</h2>
    <div id="settingsBody" style="display:none">
      <div class="settings-grid">
        <div class="field">
          <label for="gitlabUrl">GitLab URL</label>
          <input type="text" id="gitlabUrl" placeholder="https://gitlab.local:8081" />
        </div>
        <div class="field">
          <label for="projectId">Project ID</label>
          <input type="text" id="projectId" placeholder="1" />
        </div>
        <div class="field">
          <label for="triggerToken">Pipeline Trigger Token</label>
          <input type="password" id="triggerToken" placeholder="glptt-xxxxxxxxxxxxxxxxxxxx" />
        </div>
        <div class="field">
          <label for="refBranch">Ref / Branch</label>
          <input type="text" id="refBranch" value="main" />
        </div>
      </div>
      <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
      <div class="status" id="settingsStatus"></div>
    </div>
  </div>

  <!-- Source Keys -->
  <div class="panel">
    <h2>Source Keys (en-US)</h2>
    <div class="key-count" id="keyCount"></div>
    <div class="source-table-wrap">
      <table class="source-table">
        <thead>
          <tr><th>Key</th><th>Value</th><th>Context</th></tr>
        </thead>
        <tbody id="sourceBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Controls -->
  <div class="panel">
    <h2>Translate</h2>
    <div class="controls">
      <div class="field">
        <label for="langs">Target Languages (comma-separated)</label>
        <input type="text" id="langs" value="fr,ja,zh-Hant-HK" />
      </div>
      <button class="btn btn-primary" id="translateBtn" disabled>Translate</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <!-- Pipeline Info -->
  <div class="panel" id="pipelinePanel" style="display:none">
    <h2>Pipeline</h2>
    <div id="pipelineContent"></div>
  </div>

  <script>
    const sourceBody = document.getElementById("sourceBody");
    const keyCount = document.getElementById("keyCount");
    const translateBtn = document.getElementById("translateBtn");
    const langsInput = document.getElementById("langs");
    const statusEl = document.getElementById("status");
    const pipelinePanel = document.getElementById("pipelinePanel");
    const pipelineContent = document.getElementById("pipelineContent");

    // --- Settings ---
    const STORAGE_KEY = "translation-trigger-settings";

    function loadSettings() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch { return {}; }
    }

    function saveSettingsToStorage(settings) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    }

    // Populate fields from localStorage
    const saved = loadSettings();
    document.getElementById("gitlabUrl").value = saved.gitlabUrl || window.location.origin;
    document.getElementById("projectId").value = saved.projectId || "";
    document.getElementById("triggerToken").value = saved.triggerToken || "";
    document.getElementById("refBranch").value = saved.refBranch || "main";

    // Collapse settings if already configured, expand if not
    const settingsBody = document.getElementById("settingsBody");
    const settingsToggle = document.getElementById("settingsToggle");
    if (!saved.projectId || !saved.triggerToken) {
      settingsBody.style.display = "block";
      settingsToggle.innerHTML = "Settings &#9660;";
    }

    settingsToggle.addEventListener("click", () => {
      const visible = settingsBody.style.display !== "none";
      settingsBody.style.display = visible ? "none" : "block";
      settingsToggle.innerHTML = visible ? "Settings &#9654;" : "Settings &#9660;";
    });

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      const settings = {
        gitlabUrl: document.getElementById("gitlabUrl").value.replace(/\/+$/, ""),
        projectId: document.getElementById("projectId").value.trim(),
        triggerToken: document.getElementById("triggerToken").value.trim(),
        refBranch: document.getElementById("refBranch").value.trim() || "main",
      };
      saveSettingsToStorage(settings);
      const settingsStatus = document.getElementById("settingsStatus");
      settingsStatus.textContent = "Settings saved.";
      settingsStatus.className = "status success";
      setTimeout(() => {
        settingsBody.style.display = "none";
        settingsToggle.innerHTML = "Settings &#9654;";
      }, 1000);
    });

    // --- Status helper ---
    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = "status " + type;
    }

    // --- Load source keys (static file co-deployed by GitLab Pages) ---
    async function loadSource() {
      try {
        const res = await fetch("en-US.json");
        if (!res.ok) {
          throw new Error("Failed to load en-US.json");
        }

        const source = await res.json();
        const keys = Object.keys(source);
        keyCount.textContent = `${keys.length} keys`;

        sourceBody.innerHTML = keys
          .map(
            (k) =>
              `<tr>
                <td>${esc(k)}</td>
                <td>${esc(source[k].value)}</td>
                <td>${esc(source[k].context || "\u2014")}</td>
              </tr>`
          )
          .join("");

        translateBtn.disabled = false;
      } catch (err) {
        sourceBody.innerHTML = `<tr><td colspan="3">Failed to load source: ${esc(String(err))}</td></tr>`;
      }
    }

    // --- Trigger translation pipeline ---
    translateBtn.addEventListener("click", async () => {
      const settings = loadSettings();
      if (!settings.projectId || !settings.triggerToken) {
        setStatus("Configure GitLab settings first (Project ID and Trigger Token).", "error");
        return;
      }

      const langs = langsInput.value
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);

      if (langs.length === 0) {
        setStatus("Enter at least one target language.", "error");
        return;
      }

      translateBtn.disabled = true;
      translateBtn.innerHTML = '<span class="spinner"></span>Triggering...';
      setStatus(`Triggering translation pipeline for ${langs.join(", ")}...`, "info");
      pipelinePanel.style.display = "none";

      try {
        const formData = new FormData();
        formData.append("token", settings.triggerToken);
        formData.append("ref", settings.refBranch);
        formData.append("variables[TARGET_LANGUAGES]", langs.join(","));

        const url = `${settings.gitlabUrl}/api/v4/projects/${encodeURIComponent(settings.projectId)}/trigger/pipeline`;

        const res = await fetch(url, {
          method: "POST",
          body: formData,
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus(data.message || data.error || `API error ${res.status}`, "error");
          return;
        }

        statusEl.innerHTML = `Pipeline triggered successfully! <a href="${esc(data.web_url)}" target="_blank" rel="noopener">View pipeline #${data.id}</a>`;
        statusEl.className = "status success";

        showPipelineInfo(data);
      } catch (err) {
        setStatus("Request failed: " + String(err), "error");
      } finally {
        translateBtn.disabled = false;
        translateBtn.textContent = "Translate";
      }
    });

    // --- Show pipeline info ---
    function showPipelineInfo(pipeline) {
      pipelinePanel.style.display = "block";
      pipelineContent.innerHTML = `
        <div class="pipeline-info">
          <p><strong>Pipeline ID:</strong> #${pipeline.id}</p>
          <p><strong>Status:</strong> ${esc(pipeline.status)}</p>
          <p><strong>Ref:</strong> ${esc(pipeline.ref)}</p>
          <p><strong>Created:</strong> ${new Date(pipeline.created_at).toLocaleString()}</p>
          <p>
            <a href="${esc(pipeline.web_url)}" target="_blank" rel="noopener" class="btn btn-primary">
              Open Pipeline in GitLab
            </a>
          </p>
        </div>
      `;
    }

    // --- Escape HTML ---
    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    loadSource();
  </script>
</body>
</html>
